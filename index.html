<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>PSP Station</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#05070d; --ink:#f4f7ff; --dim:#8d9bb8; --hue:215;
  --font:"SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;user-select:none}
#bg{position:fixed;inset:0;transition:background 1.1s ease;
  background:
    radial-gradient(120% 90% at 20% 110%,hsl(var(--hue) 80% 28% / .9),transparent 60%),
    radial-gradient(90% 70% at 85% -10%,hsl(calc(var(--hue) + 40) 70% 22% / .8),transparent 55%),
    linear-gradient(#070b18,#03050a)}
#bg::after{content:"";position:absolute;inset:0;opacity:.35;
  background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(255,255,255,.03) 120px 121px)}
header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
  padding:max(28px,env(safe-area-inset-top)) 64px 0}
.tab{font-size:20px;font-weight:600;position:relative;padding-bottom:10px}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:3px;background:var(--ink)}
.right{display:flex;gap:22px;align-items:center;font-size:17px;color:var(--dim)}
.pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.08);font-size:14px}
.pill i{width:8px;height:8px;border-radius:50%;background:#ffb020}
.pill.ok i{background:#3ddc84}
main{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;padding-top:40px}
#rail{display:flex;align-items:flex-end;gap:22px;padding:60px 64px 40px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none}
#rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:168px;height:168px;border-radius:22px;position:relative;overflow:hidden;cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.8,.3,1.2),box-shadow .22s;outline:none;
  display:flex;align-items:flex-end;padding:14px;font-weight:700;font-size:15px;line-height:1.2}
.tile .art{position:absolute;inset:0;display:grid;place-items:center;font-size:62px;font-weight:800;letter-spacing:-2px;opacity:.9}
.tile.on{transform:scale(1.28);margin:0 34px;z-index:2;
  box-shadow:0 0 0 4px #fff,0 0 0 8px rgba(255,255,255,.18),0 28px 60px rgba(0,0,0,.6)}
.tile.add{background:rgba(255,255,255,.07);border:2px dashed rgba(255,255,255,.28);display:grid;place-items:center;padding:0}
.tile.add svg{width:54px;height:54px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
#info{padding:0 64px;min-height:120px}
#t{font-size:46px;font-weight:700;letter-spacing:-1px}
#s{margin-top:8px;color:var(--dim);font-size:18px}
#play{display:none;margin-top:18px;background:#fff;color:#05070d;border:0;border-radius:99px;padding:14px 44px;font:700 19px var(--font);cursor:pointer}
#play.show{display:inline-block}
footer{position:fixed;bottom:0;left:0;right:0;display:flex;gap:34px;justify-content:flex-end;align-items:center;
  padding:0 64px max(26px,env(safe-area-inset-bottom));color:var(--dim);font-size:15px}
.k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);margin-right:8px;font-size:13px;font-weight:700;vertical-align:middle}
#drop{position:fixed;inset:16px;border:3px dashed #fff;border-radius:28px;display:none;place-items:center;font-size:30px;font-weight:700;background:rgba(5,7,13,.8);z-index:5}
#drop.on{display:grid}
#player{position:fixed;inset:0;background:#000;z-index:10;display:none}
#player.on{display:block}
#canvas{width:100%;height:100%;display:block;outline:none}
#msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:40px;font-size:20px;line-height:1.5;pointer-events:none;white-space:pre-line}
#home{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;border:0;border-radius:99px;padding:10px 18px;
  background:rgba(20,26,44,.8);color:#fff;font:600 15px var(--font);cursor:pointer;opacity:0;transition:opacity .3s}
#player.hover #home,#home:focus{opacity:1}
@media (max-width:700px){header,#rail,#info{padding-left:24px;padding-right:24px}footer{display:none}.tile{width:132px;height:132px}#t{font-size:32px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="bg"></div>

<header>
  <div class="tab">Games</div>
  <div class="right"><span class="pill" id="off"><i></i><span>Checking…</span></span><span id="clock"></span></div>
</header>

<main>
  <div id="rail" tabindex="-1"></div>
  <div id="info"><h1 id="t"></h1><p id="s"></p><button id="play">Play</button></div>
</main>

<footer>
  <span><span class="k">✕</span>Select</span>
  <span><span class="k">△</span>Remove</span>
  <span><span class="k">○</span>Home (in game: PS button)</span>
</footer>

<div id="drop">Drop your game file to add it</div>
<input type="file" id="file" accept=".iso,.cso,.chd,.pbp" multiple hidden>

<section id="player"><canvas id="canvas" tabindex="-1"></canvas><div id="msg"></div><button id="home">⌂ Home</button></section>

<script>
// Where the emulator build lives (same origin, so it can be cached and run offline).
const ENGINE = { dir: 'build-wasm/', js: 'PPSSPPSDL.js', wasm: 'PPSSPPSDL.wasm', data: 'PPSSPPSDL.data' };

const $ = id => document.getElementById(id);
let games = [], idx = 0, playing = false;

/* ---------- storage: games are kept on this device so they work offline ---------- */
const db = new Promise((res, rej) => {
  const r = indexedDB.open('psp-station', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('games', { keyPath: 'id' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => { const d = await db; return new Promise((res, rej) => {
  const t = d.transaction('games', mode), s = t.objectStore('games'), q = fn(s);
  t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
const loadGames = async () => { games = (await tx('readonly', s => s.getAll())) || []; games.sort((a, b) => (b.played || 0) - (a.played || 0)); };

/* ---------- hub ---------- */
const hue = n => { let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const clean = n => n.replace(/\.(iso|cso|chd|pbp)$/i, '').replace(/[_]+/g, ' ');
const mb = b => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : Math.round(b / 1e6) + ' MB';

function render() {
  const rail = $('rail'); rail.innerHTML = '';
  const add = document.createElement('div'); add.className = 'tile add';
  add.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  rail.append(add);
  games.forEach(g => {
    const h = hue(g.name), t = document.createElement('div'); t.className = 'tile';
    t.style.background = `linear-gradient(150deg,hsl(${h} 70% 48%),hsl(${(h + 50) % 360} 65% 22%))`;
    t.innerHTML = `<div class="art">${clean(g.name).replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase()}</div>`;
    rail.append(t);
  });
  [...rail.children].forEach((t, i) => { t.onclick = () => idx === i ? activate() : focus(i); });
  idx = Math.min(idx, games.length); focus(idx);
}

function focus(i) {
  idx = Math.max(0, Math.min(i, games.length));
  const tiles = [...$('rail').children];
  tiles.forEach((t, j) => t.classList.toggle('on', j === idx));
  tiles[idx].scrollIntoView({ inline: 'center', block: 'nearest' });
  const g = games[idx - 1];
  $('t').textContent = g ? clean(g.name) : 'Add a game';
  $('s').textContent = g ? `${mb(g.size)} · saved on this device` : 'Pick or drop an .iso, .cso, .chd or .pbp file you own';
  $('play').textContent = g ? 'Play' : 'Choose file';
  $('play').classList.add('show');
  document.documentElement.style.setProperty('--hue', g ? hue(g.name) : 215);
}

async function addFiles(list) {
  for (const f of list) {
    if (!/\.(iso|cso|chd|pbp)$/i.test(f.name)) continue;
    await tx('readwrite', s => s.put({ id: crypto.randomUUID(), name: f.name, size: f.size, blob: f, played: 0 }));
  }
  await loadGames(); render();
}
const activate = () => idx === 0 ? $('file').click() : launch(games[idx - 1]);
async function removeCurrent() {
  const g = games[idx - 1]; if (!g || !confirm(`Remove ${clean(g.name)} from this device?`)) return;
  await tx('readwrite', s => s.delete(g.id)); await loadGames(); render();
}

$('play').onclick = activate;
$('file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('on'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) $('drop').classList.remove('on'); });
addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('on'); addFiles(e.dataTransfer.files); });
addEventListener('keydown', e => {
  if (playing) return;
  if (e.key === 'ArrowRight') focus(idx + 1);
  else if (e.key === 'ArrowLeft') focus(idx - 1);
  else if (e.key === 'Enter') activate();
  else if (e.key === 'Delete' || e.key === 'Backspace') removeCurrent();
});

/* ---------- gamepad navigation (hub only; the emulator reads the pad itself in game) ---------- */
let last = 0, held = {};
(function poll(t) {
  const pad = [...(navigator.getGamepads?.() || [])].find(Boolean);
  if (pad && !playing) {
    const b = i => pad.buttons[i]?.pressed, x = pad.axes[0] || 0;
    const dir = b(15) || x > .6 ? 1 : b(14) || x < -.6 ? -1 : 0;
    if (dir && t - last > 170) { focus(idx + dir); last = t; }
    if (b(0) && !held[0]) activate();
    if (b(3) && !held[3]) removeCurrent();
    held[0] = b(0); held[3] = b(3);
  } else if (pad && playing && pad.buttons[16]?.pressed) location.reload();
  requestAnimationFrame(poll);
})(0);

/* ---------- emulator ---------- */
async function launch(g) {
  playing = true; $('player').classList.add('on'); $('msg').textContent = 'Starting…';
  if (!crossOriginIsolated) { $('msg').textContent = 'Setting up offline mode…\nThe page will reload once.'; setTimeout(() => location.reload(), 900); return; }
  try {
    const data = new Uint8Array(await g.blob.arrayBuffer());
    const path = '/games/' + g.name.replace(/[^\w.\- ]/g, '_');
    g.played = Date.now(); tx('readwrite', s => s.put(g));
    window.Module = {
      canvas: $('canvas'),
      arguments: [path],
      locateFile: p => ENGINE.dir + p,
      print: console.log, printErr: console.warn,
      preRun: [() => { const FS = window.Module.FS || window.FS; try { FS.mkdir('/games'); } catch {} FS.writeFile(path, data); }],
      onAbort: why => { $('msg').textContent = 'The emulator stopped.\n' + why; },
      postRun: [() => { $('msg').textContent = ''; $('canvas').focus(); }]
    };
    const s = document.createElement('script');
    s.src = ENGINE.dir + ENGINE.js;
    s.onerror = () => { $('msg').textContent = 'Emulator files not found.\nPut the build-wasm folder next to index.html (see README).'; };
    document.body.append(s);
  } catch (err) { $('msg').textContent = 'Couldn’t start this game.\n' + err.message; }
}
$('home').onclick = () => location.reload();
$('player').addEventListener('mousemove', () => { $('player').classList.add('hover'); clearTimeout(window._h); window._h = setTimeout(() => $('player').classList.remove('hover'), 2500); });

/* ---------- clock, offline status, service worker ---------- */
const tick = () => $('clock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
tick(); setInterval(tick, 20000);

async function offlineStatus() {
  const ok = await caches.match(ENGINE.dir + ENGINE.wasm, { ignoreSearch: true });
  $('off').classList.toggle('ok', !!ok);
  $('off').lastChild.textContent = ok ? 'Ready offline' : (navigator.onLine ? 'Saving for offline…' : 'Emulator not saved yet');
}
async function warmEngine() {   // first online visit: pull the emulator into the cache
  await Promise.allSettled([ENGINE.js, ENGINE.wasm, ENGINE.data].map(f => fetch(ENGINE.dir + f)));
  offlineStatus();
}
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(async () => {
    await navigator.serviceWorker.ready;
    if (navigator.onLine) warmEngine();
    offlineStatus();
  }).catch(() => { $('off').lastChild.textContent = 'Offline mode unavailable here'; });
  navigator.serviceWorker.addEventListener('controllerchange', offlineStatus);
}
addEventListener('online', warmEngine); addEventListener('offline', offlineStatus);

loadGames().then(render);
</script>
</body>
</html>
